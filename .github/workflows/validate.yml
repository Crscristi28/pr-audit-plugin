name: Validate Plugin

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'pr-audit/**'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'pr-audit/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: claude plugin validate .
